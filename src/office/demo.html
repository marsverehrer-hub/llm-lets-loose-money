<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office scene demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: Barlow, system-ui, sans-serif; }
      .wrap { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
      h1 { font-size: 16px; font-weight: 700; margin: 4px 0; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; }
      #office-phone { width: 358px; }
      #status { font-size: 12px; color: var(--fg-3); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Office scene: dev harness (?tier=0..5&amp;staff=N&amp;theme=light)</h1>
      <div id="office"></div>
      <div id="office-phone"></div>
      <div class="controls">
        <button class="btn btn-sm" id="btn-tier">Cycle office tier</button>
        <button class="btn btn-sm" id="btn-hire">+5 staff (random role)</button>
        <button class="btn btn-sm" id="btn-fire">-5 staff</button>
        <button class="btn btn-sm" id="btn-train">Toggle training run</button>
        <button class="btn btn-sm" id="btn-gpus">+500 rented GPUs</button>
        <button class="btn btn-sm" id="btn-model">New unreleased model</button>
        <button class="btn btn-sm" id="btn-cash">Toggle negative cash</button>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
